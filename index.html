<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1319" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Osobní ranní a odpolední zpravodajský briefing pro Honzu.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Briefing">
  <title>Honzův briefing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="reading-progress" aria-hidden="true"><span id="reading-progress-bar"></span></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Honzův briefing – začátek">
        <span class="brand-mark" aria-hidden="true">H.</span>
        <span>Honzův briefing</span>
      </a>
      <div class="header-actions">
        <button class="quiet-button" id="install-button" type="button" hidden>Nainstalovat</button>
        <button class="quiet-button" id="refresh-button" type="button">Obnovit</button>
      </div>
    </div>
  </header>

  <nav class="section-nav" id="section-nav" aria-label="Sekce briefingu" hidden></nav>

  <main id="app" class="wrap" aria-live="polite" aria-busy="true">
    <section class="loading-card">
      <p class="eyebrow">Denní briefing pro Honzu</p>
      <h1>Načítám aktuální vydání…</h1>
      <p>Pokud jste offline, zobrazí se poslední uložené vydání.</p>
    </section>
  </main>

  <noscript>
    <p class="noscript">Pro zobrazení briefingu je potřeba povolit JavaScript.</p>
  </noscript>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>Honzův briefing</span>
      <span>Aktualizace v 7:00 a 16:30</span>
    </div>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
